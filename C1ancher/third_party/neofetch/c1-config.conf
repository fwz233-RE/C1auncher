# C1-Slim profile for Neofetch 7.1.0.
# The full 49x19 profile and logo are retained for normal terminals / --stdout.
# Only the launcher's no-argument, small-TTY path selects the compact renderer.

# Render raw values, never truncate Neofetch's ANSI-formatted output. Keep one
# column unused (no pending autowrap), plus the command and next shell-prompt
# rows. UTF-8 is decoded as bytes so this also works with the device's C locale:
# ASCII costs one cell; every other valid scalar is conservatively budgeted as
# two. This can shorten accented/combining text early, but preserves valid UTF-8
# and safely accommodates CJK/emoji without a locale or wcwidth dependency.
# Controls and malformed UTF-8 become plain text, never terminal instructions.
c1_compact_line() {
    (( c1_print_rows < c1_print_limit && c1_print_width > 0 )) || return 0
    local LC_ALL=C
    local raw="$1${2:+: $2}" fitted= prefix= ch piece code next scalar count cost
    local i=0 j used=0 valid
    while (( i < ${#raw} )); do
        ch=${raw:i:1}
        printf -v code '%d' "'$ch"
        piece=$ch count=1 cost=1
        if (( code < 32 || code == 127 )); then
            case $ch in
                $'\n'|$'\r'|$'\t') piece=' ' ;;
                *) piece='?' ;;
            esac
        elif (( code >= 128 )); then
            valid=1
            if (( code >= 194 && code <= 223 )); then
                count=2 scalar=$((code & 31))
            elif (( code >= 224 && code <= 239 )); then
                count=3 scalar=$((code & 15))
            elif (( code >= 240 && code <= 244 )); then
                count=4 scalar=$((code & 7))
            else
                valid=0
            fi
            for ((j=1; valid && j<count; j++)); do
                if (( i+j >= ${#raw} )); then valid=0; break; fi
                printf -v next '%d' "'${raw:i+j:1}"
                if (( next < 128 || next > 191 )); then valid=0; break; fi
                scalar=$(((scalar << 6) | (next & 63)))
            done
            if (( valid && ((count == 3 && scalar < 2048) ||
                            (count == 4 && scalar < 65536) ||
                            (scalar >= 55296 && scalar <= 57343) || scalar > 1114111) )); then
                valid=0
            fi
            if (( ! valid )); then
                piece='?' count=1
            elif (( scalar < 160 )); then
                piece='?' # Unicode C1 control characters, including CSI/OSC.
            else
                piece=${raw:i:count} cost=2
            fi
        fi
        if (( used + cost > c1_print_width )); then
            if (( c1_print_width >= 3 )); then fitted="${prefix}..."; fi
            break
        fi
        fitted+=$piece
        used=$((used + cost))
        if (( used <= c1_print_width - 3 )); then prefix=$fitted; fi
        i=$((i + count))
    done
    printf '%s\n' "$fitted"
    c1_print_rows=$((c1_print_rows + 1))
}

c1_compact_info() {
    (( c1_print_rows < c1_print_limit && c1_print_width > 0 )) || return 0
    "get_$2"
    c1_compact_line "$1" "${!2:-Unavailable}"
}

print_info() {
    if [[ ${C1_NEOFETCH_COMPACT:-0} == 1 ]]; then
        local c1_print_rows=0 c1_print_limit=$((LINES - 2)) c1_print_width=$((COLUMNS - 1))
        c1_compact_line "Device" "C1-Slim MP-D261"
        c1_compact_info "OS" distro
        c1_compact_info "Kernel" kernel
        c1_compact_info "Battery" c1_battery
        c1_compact_info "Wi-Fi" c1_wifi
        c1_compact_info "Storage" c1_storage
        c1_compact_info "Uptime" uptime
        c1_compact_info "Memory" memory
        c1_compact_info "IP" c1_ip
        c1_compact_line "SoC" "Ingenic X1600"
        c1_compact_line "CPU" "XBurst MIPS32r2 (1)"
        return
    fi
    prin "Device" "C1-Slim MP-D261"
    prin "SoC" "Ingenic X1600"
    prin "CPU" "XBurst MIPS32r2 (1)"
    info "OS" distro
    info "Kernel" kernel
    info "Uptime" uptime
    info "Memory" memory
    info "Battery" c1_battery
    info "Wi-Fi" c1_wifi
    info "IP" c1_ip
    info "Storage" c1_storage
}

# --stdout prevents upstream ANSI/logo output. Suppress its trailing blank row
# only in automatic compact mode; explicit --stdout keeps the full behavior.
if [[ ${C1_NEOFETCH_COMPACT:-0} == 1 ]]; then
    dynamic_prompt() { :; }
fi

get_c1_battery() {
    local base=/sys/class/power_supply/battery
    local capacity status voltage

    if [[ -r $base/capacity ]]; then
        capacity=$(< "$base/capacity")
        status=$(< "$base/status")
        voltage=$(< "$base/voltage_now")
        if [[ $voltage =~ ^[0-9]+$ ]]; then
            voltage=$(awk -v value="$voltage" 'BEGIN {printf "%.2fV", value / 1000000}')
        else
            voltage=""
        fi
        c1_battery="${capacity}% ${status}${voltage:+ ${voltage}}"
    else
        c1_battery="Unavailable"
    fi
}

get_c1_wifi() {
    local wireless

    wireless=$(iwconfig wlan0 2>/dev/null)
    if [[ $wireless == *'ESSID:"'* ]]; then
        c1_wifi=${wireless#*ESSID:\"}
        c1_wifi=${c1_wifi%%\"*}
    else
        c1_wifi="Disconnected"
    fi
}

get_c1_ip() {
    c1_ip=$(ip -4 addr show wlan0 2>/dev/null |
        awk '/inet / {sub(/\/.*/, "", $2); print $2; exit}')
    [[ -n $c1_ip ]] || c1_ip="None"
}

get_c1_storage() {
    local line total used percent
    local -a fields

    line=$(df -kP /storage 2>/dev/null | tail -n 1)
    read -ra fields <<< "$line"
    total=${fields[1]}
    used=${fields[2]}
    percent=${fields[4]}
    if [[ $total =~ ^[0-9]+$ && $used =~ ^[0-9]+$ ]]; then
        c1_storage=$(awk -v used="$used" -v total="$total" -v percent="$percent" \
            'BEGIN {printf "%.1fG / %.1fG (%s)", used/1048576, total/1048576, percent}')
    else
        c1_storage="Unavailable"
    fi
}

# Monochrome output avoids unreadable color combinations on the e-paper panel.
colors=(7 7 7 7 7 7)
bold="on"
underline_enabled="off"
separator=":"
color_blocks="off"
image_backend="ascii"
ascii_colors=(7)
ascii_bold="on"
gap=1

# Keep generated values compact enough for 49 columns.
distro_shorthand="on"
os_arch="off"
kernel_shorthand="on"
uptime_shorthand="tiny"
memory_percent="on"
memory_unit="mib"
cpu_speed="off"
cpu_cores="logical"
disk_show=("/storage")
disk_percent="on"