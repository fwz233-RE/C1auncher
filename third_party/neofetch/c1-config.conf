# C1-Slim profile for Neofetch 7.1.0.
# Designed for the 49x19 monochrome e-paper terminal.

print_info() {
    prin "Device" "C1-Slim MP-D261"
    prin "SoC" "Ingenic X1600"
    prin "CPU" "XBurst MIPS32r2 (1)"
    info "OS" distro
    info "Kernel" kernel
    info "Uptime" uptime
    info "Memory" memory
    info "Battery" c1_battery
    info "Wi-Fi" c1_wifi
    info "IP" c1_ip
    info "Storage" c1_storage
}

get_c1_battery() {
    local base=/sys/class/power_supply/battery
    local capacity status voltage

    if [[ -r $base/capacity ]]; then
        capacity=$(< "$base/capacity")
        status=$(< "$base/status")
        voltage=$(< "$base/voltage_now")
        if [[ $voltage =~ ^[0-9]+$ ]]; then
            voltage=$(awk -v value="$voltage" 'BEGIN {printf "%.2fV", value / 1000000}')
        else
            voltage=""
        fi
        c1_battery="${capacity}% ${status}${voltage:+ ${voltage}}"
    else
        c1_battery="Unavailable"
    fi
}

get_c1_wifi() {
    local wireless

    wireless=$(iwconfig wlan0 2>/dev/null)
    if [[ $wireless == *'ESSID:"'* ]]; then
        c1_wifi=${wireless#*ESSID:\"}
        c1_wifi=${c1_wifi%%\"*}
    else
        c1_wifi="Disconnected"
    fi
}

get_c1_ip() {
    c1_ip=$(ip -4 addr show wlan0 2>/dev/null |
        awk '/inet / {sub(/\/.*/, "", $2); print $2; exit}')
    [[ -n $c1_ip ]] || c1_ip="None"
}

get_c1_storage() {
    local line total used percent
    local -a fields

    line=$(df -kP /storage 2>/dev/null | tail -n 1)
    read -ra fields <<< "$line"
    total=${fields[1]}
    used=${fields[2]}
    percent=${fields[4]}
    if [[ $total =~ ^[0-9]+$ && $used =~ ^[0-9]+$ ]]; then
        c1_storage=$(awk -v used="$used" -v total="$total" -v percent="$percent" \
            'BEGIN {printf "%.1fG / %.1fG (%s)", used/1048576, total/1048576, percent}')
    else
        c1_storage="Unavailable"
    fi
}

# Monochrome output avoids unreadable color combinations on the e-paper panel.
colors=(7 7 7 7 7 7)
bold="on"
underline_enabled="off"
separator=":"
color_blocks="off"
image_backend="ascii"
ascii_colors=(7)
ascii_bold="on"
gap=1

# Keep generated values compact enough for 49 columns.
distro_shorthand="on"
os_arch="off"
kernel_shorthand="on"
uptime_shorthand="tiny"
memory_percent="on"
memory_unit="mib"
cpu_speed="off"
cpu_cores="logical"
disk_show=("/storage")
disk_percent="on"